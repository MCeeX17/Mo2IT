<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact us | Mo2IT</title>
<meta name="description" content="Call, WhatsApp, email or message Mo2IT Technologies.">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main">
<section class="pagehead"><canvas class="net" aria-hidden="true"></canvas><div class="wrap"><h1>Contact us</h1><p>Call, WhatsApp, email or send us a message here.</p></div></section>
<section><div class="wrap split">
  <form method="post" id="contact">
    <label>Full name<input name="name" required maxlength="100" autocomplete="name"></label>
    <label>Mobile number<input name="phone" type="tel" required maxlength="20" pattern="\+?[0-9 \(\)\-]{9,20}" autocomplete="tel" title="At least 9 digits"></label>
    <label>Email<input name="email" type="email" required maxlength="150" autocomplete="email"></label>
    <label>Message<textarea name="message" rows="6" required maxlength="3000"></textarea></label>
    <label class="check"><input type="checkbox" required> <span>I agree to the <a href="privacy.html" target="_blank">privacy policy</a>.</span></label>
    <input name="website_url" class="trap" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button class="btn" type="submit">Send message</button><p class="status" role="status"></p>
  </form>
  <aside class="summary" id="contact-details"></aside>
</div></section>
</main>
<footer id="site-footer"></footer>
<script type="module" src="js/site.js"></script>
<script type="module" src="js/contact.js"></script>
</body>
</html>
