<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | Mo2IT</title>
<meta name="description" content="Mo2IT administration.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin">
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main">
<section class="pagehead"><canvas class="net" aria-hidden="true"></canvas><div class="wrap"><h1>Admin</h1><p>For the Mo2IT team.</p></div></section>
<section><div class="wrap">
  <p class="notice" id="offline" hidden></p>
  <form method="post" id="admin-login" class="narrow" hidden><label>Admin email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="btn">Sign in as admin</button><p class="status" role="status"></p></form>
  <div id="dash" hidden>
    <div class="tabs"><button type="button" data-tab="inbox" aria-pressed="true">Requests <span id="new-count"></span></button><button type="button" data-tab="chats" aria-pressed="false">Client chats <span id="unread-count"></span></button><button type="button" class="link" id="logout">Sign out</button></div>
    <p class="status" id="dash-status" role="status"></p>
    <div id="inbox"></div>
    <div id="chats" class="split reverse" hidden><div id="threads"></div>
      <div><h2 id="who">Select a client</h2><div class="chat" id="chat"></div><form method="post" id="send" class="send" hidden><label class="sr" for="text">Reply</label><textarea id="text" name="text" rows="2" required maxlength="2000" placeholder="Write a reply"></textarea><button class="btn">Send reply</button></form></div></div>
  </div>
</div></section>
</main>
<footer id="site-footer"></footer>
<script type="module" src="js/site.js"></script>
<script type="module" src="js/admin.js"></script>
</body>
</html>
