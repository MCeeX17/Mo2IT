<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My profile | Mo2IT</title>
<meta name="description" content="Your Mo2IT client profile.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="portal">
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main">
<section class="pagehead"><canvas class="net" aria-hidden="true"></canvas><div class="wrap"><h1>My profile</h1><p>Message the team, update your details and see your requests.</p></div></section>
<section><div class="wrap split" id="app" hidden>
  <div>
    <h2>Messages</h2><div class="chat" id="chat" aria-live="polite"></div>
    <form method="post" id="send" class="send"><label class="sr" for="text">Message</label><textarea id="text" name="text" rows="2" required maxlength="2000" placeholder="Write a message to the team"></textarea><button class="btn">Send</button></form>
    <p class="status" id="chat-status" role="status"></p>
    <h2>My requests</h2><div id="mine"></div><p><a href="quote.html">Make a new request</a></p>
  </div>
  <aside class="summary"><h2>My details</h2>
    <form method="post" id="profile"><label>Full name<input name="name" required maxlength="100"></label><label>Mobile number<input name="phone" type="tel" required maxlength="20"></label><label>Company (optional)<input name="company" maxlength="100"></label><button class="btn">Save details</button><p class="status" role="status"></p></form>
    <button class="link" id="logout" type="button">Sign out</button></aside>
</div></section>
</main>
<footer id="site-footer"></footer>
<script type="module" src="js/site.js"></script>
<script type="module" src="js/portal.js"></script>
</body>
</html>
