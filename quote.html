<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get a quote or book | Mo2IT</title>
<meta name="description" content="Build a custom quote and book Mo2IT for a website, mobile app, design or custom project.">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="quote">
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main">
<section class="pagehead"><canvas class="net" aria-hidden="true"></canvas><div class="wrap"><h1>Build your quote</h1><p>Tick what you want to see an estimate, then send us your details to book. Sending a request is free and does not commit you to anything.</p></div></section>
<form method="post" id="quote" class="wrap split">
  <div>
    <fieldset><legend>Add services to your estimate</legend><p class="hint">Optional. Skip this if you are not sure yet.</p><div id="options"></div></fieldset>
    <fieldset><legend>Your details</legend>
      <label>Full name<input name="name" required maxlength="100" autocomplete="name"></label>
      <label>Mobile number<input name="phone" type="tel" required maxlength="20" pattern="\+?[0-9 \(\)\-]{9,20}" autocomplete="tel" title="At least 9 digits, for example 082 123 4567"></label>
      <label>Email<input name="email" type="email" required maxlength="150" autocomplete="email"></label>
      <label>What are you looking for?<select name="type" required>
        <option value="">Choose one</option><option value="website">Website</option><option value="mobile">Mobile application</option><option value="prototype">Prototype design</option><option value="uiux">UI/UX design</option><option value="custom">Custom</option></select></label>
      <label id="custom-wrap" hidden>Type what you need<input name="custom" maxlength="150"></label>
      <label>Describe what you need<textarea name="message" rows="6" required maxlength="3000"></textarea></label>
      <label>Preferred date for a call (optional)<input name="date" type="date"></label>
      <label class="check"><input type="checkbox" required> <span>I agree to the <a href="privacy.html" target="_blank">privacy policy</a>.</span></label>
      <input name="website_url" class="trap" tabindex="-1" autocomplete="off" aria-hidden="true">
    </fieldset>
  </div>
  <aside class="summary"><h2>Your estimate</h2><ul id="lines"></ul><p class="total"><span>From</span> <output id="total">R0</output></p><p id="monthly"></p>
    <button class="btn" type="submit">Send booking request</button><p class="status" role="status"></p></aside>
</form>
<div class="wrap"><div id="result"></div></div>
</main>
<footer id="site-footer"></footer>
<script type="module" src="js/site.js"></script>
<script type="module" src="js/quote.js"></script>
</body>
</html>
